name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  judge-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run reference evaluation
        run: |
          python - <<'PY'
          import re
          import subprocess

          result = subprocess.run(
              [
                  "python",
                  "environment/judge.py",
                  "--solution",
                  "reference_solution/transformer_block.py",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout, end="")
          score_line = result.stdout.strip().splitlines()[-1]
          match = re.search(r"([0-9]+(?:\.[0-9]+)?)$", score_line)
          if match is None:
              raise SystemExit(f"Could not parse judge score from: {score_line!r}")
          score = float(match.group(1))
          if score < 0.95:
              raise SystemExit(f"Expected judge score >= 0.95, got {score:.4f}")
          print(f"Verified judge score: {score:.4f}")
          PY

      - name: Run test suite
        run: pytest tests/ -v
