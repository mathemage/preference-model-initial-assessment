name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  judge-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run reference evaluation
        run: |
          python - <<'PY'
          import json
          import subprocess

          try:
              result = subprocess.run(
                  [
                      "python",
                      "environment/judge.py",
                      "--solution",
                      "reference_solution/transformer_block.py",
                      "--json",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          except subprocess.CalledProcessError as e:
              if e.stdout:
                  print(e.stdout, end="")
              if e.stderr:
                  print(e.stderr, end="")
              raise SystemExit(e.returncode)
          print(result.stdout, end="")
          report = json.loads(result.stdout)
          score = float(report["score"])
          if score < 0.95:
              raise SystemExit(f"Expected judge score >= 0.95, got {score:.4f}")
          print(f"Verified judge score: {score:.4f}")
          PY

      - name: Run test suite
        run: pytest tests/ -v
